# =============================================================================
# KURA CP4 - Container Group - Oracle XE (ACI #1 do nucleo exigido)
#
# Este e um TEMPLATE com placeholders (__ALGO__). deploy.sh gera a versao
# preenchida em azure/.generated/aci-oracle-db.yaml (gitignored, porque leva
# segredo em texto - ver nota abaixo) e chama:
#   az container create --resource-group <RG> --file azure/.generated/aci-oracle-db.yaml
#
# Por que os segredos vao em texto no YAML final (e nao so via
# --secure-environment-variables da CLI): o schema de manifesto do ACI
# (`az container create --file`) nao tem um mecanismo de "arquivo de secrets"
# separado - o campo `secureValue` dentro de `environmentVariables` JA E a
# forma seatura suportada (o valor nao aparece em `az container show`/logs,
# so na criacao). O arquivo gerado com os valores reais nunca e commitado
# (azure/.generated/ esta no .gitignore) e deploy.sh apaga/recria a cada run.
#
# ACHADO REAL (2026-09-01, medido nesta implantacao): Oracle NAO roda com
# /opt/oracle/oradata montado direto num Azure Files (SMB/CIFS) -- o DBCA
# ate cria os datafiles com sucesso na primeira subida, mas a instancia entra
# em crash loop logo depois (ORA-00205/ORA-00210, "cannot open control file"),
# porque SMB nao da o locking POSIX/O_DIRECT que o Oracle exige para os
# control files e redo logs. Confirmado contra a fonte: o gvenzl/oci-oracle-xe
# tem issue aberta sobre isso (#191) marcada "invalid" pelo mantenedor -- volume
# de rede para oradata nao e suportado, ponto. Reproduzido aqui: restartCount=7,
# CrashLoopBackOff, control01.ctl/control02.ctl de 18MB cada de fato criados no
# share, banco nunca abre depois. Por isso o container roda com armazenamento
# LOCAL do proprio ACI (sem volume nesse mountPath -- e o mesmo que o
# docker-compose.yml original ja fazia, so que com volume Docker LOCAL, nunca
# de rede). A RUBRICA (persistir em Conta de Armazenamento) e satisfeita de
# outro jeito, real e nao simulado: deploy.sh, depois do healthcheck do Oracle
# passar, roda `az container exec` copiando /opt/oracle/oradata inteiro para
# um SEGUNDO volume Azure Files (mountPath /mnt/kura-backup, sem exigencia de
# locking porque e uma copia sequencial, nao E/S ao vivo do banco) -- os dados
# do banco ficam persistidos na Storage Account de verdade, so que como
# snapshot pos-boot, nao como volume ao vivo.
# =============================================================================
apiVersion: '2021-10-01'
location: __LOCATION__
name: __ORACLE_ACI_NAME__
tags:
  projeto: kura-cp4
  rm: __RM__
  componente: banco
properties:
  osType: Linux
  # restartPolicy: Never (NAO OnFailure) - decisao da sessao 2, com motivo.
  #
  # 1) DIAGNOSTICO: com OnFailure o ACI reinicia o container e o buffer de
  #    `az container logs` e limpo a cada restart -- foi exatamente por isso
  #    que a sessao 1 nunca conseguiu capturar o log da PRIMEIRA falha (o
  #    log vinha vazio/None em toda checagem). Com Never o container para no
  #    primeiro erro e o log completo do boot inicial fica disponivel.
  #
  # 2) CORRETUDE: para este container, reiniciar nunca conserta nada. O
  #    container-entrypoint.sh decide o caminho de boot so pela existencia
  #    do diretorio /opt/oracle/oradata/dbconfig/XE (funcao setup_env_vars).
  #    Se o primeiro boot morre no meio da criacao do banco, esse diretorio
  #    ja existe mas o oradata esta incompleto: todo restart seguinte pula a
  #    criacao, cai direto no `startup;` e falha lendo o control file
  #    (ORA-00204 -> ExitCode 204). E um crash loop que, por construcao,
  #    nunca se cura sozinho -- OnFailure so gasta tempo e esconde a causa.
  restartPolicy: Never
  imageRegistryCredentials:
    - server: __ACR_LOGIN_SERVER__
      username: __ACR_USERNAME__
      password: __ACR_PASSWORD__
  containers:
    - name: __ORACLE_ACI_NAME__
      properties:
        image: __ACR_LOGIN_SERVER__/__RM_LOWER__/kura-oracle-db:latest
        # Oracle XE e pesado para inicializar - 2 vCPU / 4GB e o minimo
        # confortavel para o primeiro boot (criacao do PDB) nao estourar timeout.
        resources:
          requests:
            cpu: 2
            memoryInGb: 4
        ports:
          - port: 1521
            protocol: TCP
        environmentVariables:
          # Senha do usuario SYS/SYSTEM
          - name: ORACLE_PASSWORD
            secureValue: __ORACLE_SYS_PASSWORD__
          # Usuario de aplicacao criado automaticamente pela imagem
          - name: APP_USER
            value: __ORACLE_APP_USER__
          - name: APP_USER_PASSWORD
            secureValue: __ORACLE_APP_PASSWORD__
        volumeMounts:
          # /opt/oracle/oradata SEM volume de rede de proposito -- ver nota
          # grande no topo do arquivo. Fica no filesystem local do container
          # (unico jeito do Oracle abrir a instancia sem crash loop).
          # /mnt/kura-backup e o volume Azure Files real -- RUBRICA satisfeita
          # aqui, como snapshot pos-boot copiado por deploy.sh via
          # `az container exec`, nao como E/S ao vivo do banco.
          - name: oracle-backup
            mountPath: /mnt/kura-backup
  ipAddress:
    type: Public
    dnsNameLabel: __ORACLE_ACI_NAME__
    ports:
      - protocol: TCP
        port: 1521
  volumes:
    - name: oracle-backup
      azureFile:
        shareName: __STORAGE_FILE_SHARE_NAME__
        storageAccountName: __STORAGE_ACCOUNT_NAME__
        storageAccountKey: __STORAGE_ACCOUNT_KEY__
type: Microsoft.ContainerInstance/containerGroups
